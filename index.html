<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台北市三維圖台 (1.105+ 語法修復版)</title>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #000; }
        #cesiumContainer { width: 100%; height: 100%; display: block; }
        
        #loadingOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 1.25rem; z-index: 20; transition: opacity 0.5s ease;
        }
        
        /* 防暈眩遮罩 */
        .vignette-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; pointer-events: none; 
            background: radial-gradient(circle, rgba(0,0,0,0) 30%, rgba(0,0,0,0.95) 100%);
            opacity: 0; transition: opacity 0.15s ease-in-out; 
        }
        .vignette-layer.active { opacity: 1; }

        /* 右上角面板 */
        #ui-panel {
            position: absolute; top: 20px; right: 20px; z-index: 10000;
            background-color: rgba(0, 0, 0, 0.85); color: #00FF00;
            border: 1px solid #00FF00; padding: 12px 16px;
            font-family: Consolas, monospace; font-size: 14px;
            border-radius: 4px; box-shadow: 0 0 10px rgba(0, 255, 0, 0.2); 
            user-select: none;
        }
        #ui-panel label { cursor: pointer; display: flex; align-items: center; gap: 8px; }
        #ui-panel input[type="checkbox"] { accent-color: #00FF00; width: 16px; height: 16px; cursor: pointer; }
    </style>

    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.105.1/Build/Cesium/Widgets/widgets.css">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.105.1/Build/Cesium/Cesium.js"></script>
</head>
<body>
    <div id="loadingOverlay">載入 3D 引擎與衛星圖資中，請稍候...</div>
    
    <div id="cesiumContainer"></div>
    <div id="vignette-mask" class="vignette-layer"></div>
    
    <div id="ui-panel">
        <label>
            <input type="checkbox" id="antiSicknessToggle">
            開啟防暈模式 (動態遮罩 + 景深)
        </label>
    </div>

    <script>
        // 必須包在 async 函數內，才能使用最新的非同步語法
        async function initApp() {
            const taipeiLongitude = 121.5654;
            const taipeiLatitude = 25.0330;
            const viewHeight = 1500.0;

            Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6InVmWlRUZWJKZEIzc0VibUYiLCJqdGkiOiI4ZThmMzVhMi1hNGNlLTQ4NGEtODU1NC02ODg0MjRmZTczZTQiLCJpZCI6MTQ3NDQyLCJzdWIiOiJpbHVrYWEiLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidGVzdGNlc2l1bSIsImlhdCI6MTc5Mjg1MjE1MH0.AhSN6dizcHH7jKHXbJ6vTdHDg3FqWPj8p7Qz86moNsw';

            try {
                // 修正 1：地形必須改用 await Cesium.createWorldTerrainAsync()
                const terrain = await Cesium.createWorldTerrainAsync();

                // 修正 2：Viewer 初始化不可再放入 imageryProvider，先給空陣列
                const viewer = new Cesium.Viewer('cesiumContainer', {
                    terrainProvider: terrain, 
                    baseLayerPicker: false, geocoder: false, homeButton: false,
                    sceneModePicker: false, navigationHelpButton: false, animation: false,
                    timeline: false, fullscreenButton: false,
                    baseLayer: false // 初始化不載入預設底圖
                });

                viewer.scene.globe.depthTestAgainstTerrain = true;

                // 修正 3：底圖必須使用 ImageryLayer 並指定給 baseLayer
                const nlscProvider = new Cesium.WebMapTileServiceImageryProvider({
                    url: 'https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/{TileMatrix}/{TileRow}/{TileCol}',
                    layer: 'PHOTO2',
                    style: 'default',
                    format: 'image/jpeg',
                    tileMatrixSetID: 'GoogleMapsCompatible',
                    maximumLevel: 19
                });
                viewer.scene.imageryLayers.addImageryProvider(nlscProvider);

                // 修正 4：3D Tiles 必須改用 await Cesium.Cesium3DTileset.fromUrl()
                try {
                    // 1. 暫時註解掉 NLSC 的圖資，因為他們伺服器目前 Decoding Failed
                    // const tileset = await Cesium.Cesium3DTileset.fromUrl('https://3dtiles.nlsc.gov.tw/building/tiles3d/0/tileset.json');
                    
                    // 2. 改用 Cesium 官方的 OSM 3D 建築來測試你的防暈眩與景深 UI
                    const tileset = await Cesium.createOsmBuildingsAsync();
                    viewer.scene.primitives.add(tileset);
                    
                } catch (tileErr) {
                    // 捕捉 GLB 檔案 deocding failed 錯誤，不讓程式崩潰
                    //console.warn("部分 3D 模型載入失敗，略過錯誤繼續執行", tileErr);
                    console.warn("3D 模型載入失敗", tileErr);
                }

                // 飛向台北
                viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(taipeiLongitude, taipeiLatitude, viewHeight),
                    orientation: { heading: 0.0, pitch: Cesium.Math.toRadians(-60.0), roll: 0.0 }
                });

                // ================= 防暈機制設定 =================
                // 修正 5：確認 postProcessStages 存在後才設定 enabled (解決 Uncaught TypeError)
                if (viewer.scene.postProcessStages && viewer.scene.postProcessStages.depthOfField) {
                    viewer.scene.postProcessStages.depthOfField.enabled = false;
                    viewer.scene.postProcessStages.depthOfField.focalLength = 20.0; 
                    viewer.scene.postProcessStages.depthOfField.fStop = 4.0;
                }

                const antiSicknessToggle = document.getElementById('antiSicknessToggle');
                const maskElement = document.getElementById('vignette-mask');
                let isMoving = false;
                let isAntiSicknessEnabled = false;

                antiSicknessToggle.addEventListener('change', function(e) {
                    isAntiSicknessEnabled = e.target.checked;
                    if (viewer.scene.postProcessStages.depthOfField) {
                        viewer.scene.postProcessStages.depthOfField.enabled = isAntiSicknessEnabled;
                    }
                    if (!isAntiSicknessEnabled) {
                        maskElement.classList.remove('active');
                    }
                });

                const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

                function enableMask() {
                    isMoving = true;
                    if (isAntiSicknessEnabled) {
                        maskElement.classList.add('active');
                        if (viewer.scene.postProcessStages.depthOfField) {
                            viewer.scene.postProcessStages.depthOfField.focalDistance = 3000.0; 
                        }
                    }
                }

                function disableMask() {
                    isMoving = false;
                    if (isAntiSicknessEnabled) {
                        maskElement.classList.remove('active');
                    }
                }

                handler.setInputAction(enableMask, Cesium.ScreenSpaceEventType.LEFT_DOWN);
                handler.setInputAction(enableMask, Cesium.ScreenSpaceEventType.MIDDLE_DOWN);
                handler.setInputAction(enableMask, Cesium.ScreenSpaceEventType.RIGHT_DOWN);

                handler.setInputAction(disableMask, Cesium.ScreenSpaceEventType.LEFT_UP);
                handler.setInputAction(disableMask, Cesium.ScreenSpaceEventType.MIDDLE_UP);
                handler.setInputAction(disableMask, Cesium.ScreenSpaceEventType.RIGHT_UP);

                let wheelTimer;
                handler.setInputAction(function() {
                    enableMask();
                    clearTimeout(wheelTimer);
                    wheelTimer = setTimeout(disableMask, 500);
                }, Cesium.ScreenSpaceEventType.WHEEL);

                handler.setInputAction(function(movement) {
                    if (isMoving || !isAntiSicknessEnabled) return; 
                    const pickedPosition = viewer.scene.pickPosition(movement.endPosition);
                    if (Cesium.defined(pickedPosition) && viewer.scene.postProcessStages.depthOfField) {
                        const distance = Cesium.Cartesian3.distance(viewer.camera.position, pickedPosition);
                        viewer.scene.postProcessStages.depthOfField.focalDistance = distance;
                    }
                }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

            } catch (error) {
                console.error("初始化過程中發生未預期錯誤:", error);
            } finally {
                // 無論成功與否，最終一定移除 Loading 畫面
                setTimeout(() => {
                    const overlay = document.getElementById('loadingOverlay');
                    if(overlay) {
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.style.display = 'none', 500);
                    }
                }, 1000);
            }
        }

        // 啟動主程式
        initApp();
    </script>
</body>
</html>
